name: Build

# Every push builds the Windows installer, Android APK, macOS disk image and
# iOS app (download them from the run's Artifacts). They're attached to a GitHub Release when:
#   - you publish a release on GitHub (any tag name), or
#   - you push a tag like v0.2.0 (a release is created for it), or
#   - you run this workflow by hand with "release_tag" set.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the builds to this existing release (its tag name). Leave empty to just build."
        required: false
        default: ""

# Publishing a release on GitHub with a new tag fires both a tag push and a
# release event; keep only the newest run for the same ref.
concurrency:
  group: build-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Work out the version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"
          elif [[ "$RELEASE_TAG" == v* ]]; then v="${RELEASE_TAG#v}"
          else v="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release --build-name=${{ steps.version.outputs.version }}

      # Flutter apps need the Visual C++ runtime; ship it so Sidekick runs
      # on a fresh Windows install too.
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build\windows\x64\runner\Release\
          }

      - name: Build the installer
        shell: pwsh
        run: |
          # The script needs Inno Setup 6.3+; install or upgrade to be sure.
          choco upgrade innosetup -y --no-progress
          $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup (ISCC.exe) not found' }
          & $iscc.FullName "/DAppVersion=${{ steps.version.outputs.version }}" windows\installer\sidekick.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: sidekick-windows
          path: app/build/installer/SidekickSetup-*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Work out the version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"
          elif [[ "$RELEASE_TAG" == v* ]]; then v="${RELEASE_TAG#v}"
          else v="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Optional: sign with your own key so updates install over old versions
      # (see README). Without these secrets the APK uses a throwaway debug key.
      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIDEKICK_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - run: flutter pub get
      - name: Build the APK
        env:
          SIDEKICK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIDEKICK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIDEKICK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }}
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-release.apk "build/dist/Sidekick-${{ steps.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sidekick-android
          path: app/build/dist/*.apk
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Work out the version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"
          elif [[ "$RELEASE_TAG" == v* ]]; then v="${RELEASE_TAG#v}"
          else v="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter build macos --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }}

      # A disk image with the app and a shortcut to Applications to drag it to.
      - name: Package the .dmg
        run: |
          app="$(ls -d build/macos/Build/Products/Release/*.app | head -1)"
          mkdir -p build/dmg build/dist
          cp -R "$app" build/dmg/Sidekick.app
          dmg="build/dist/Sidekick-${{ steps.version.outputs.version }}.dmg"
          # The drag-to-install window: background (sharp on Retina), Sidekick
          # under the arrow's tail, Applications under its head.
          tiffutil -cathidpicheck macos/packaging/dmg-background.png macos/packaging/dmg-background@2x.png \
            -out build/dmg-background.tiff
          brew install create-dmg || true
          styled=0
          for i in 1 2 3; do
            rm -f "$dmg"
            if create-dmg --volname Sidekick --background build/dmg-background.tiff \
                --window-pos 200 120 --window-size 640 453 --icon-size 112 \
                --icon Sidekick.app 417 293 --hide-extension Sidekick.app \
                --app-drop-link 233 293 "$dmg" build/dmg; then
              styled=1
              break
            fi
            sleep 5
          done
          if [ "$styled" = 0 ]; then
            echo "::warning::Styling the .dmg failed; making a plain one"
            ln -s /Applications build/dmg/Applications
            # hdiutil is occasionally "busy" on CI machines; retry a few times.
            for i in 1 2 3; do
              hdiutil create -volname Sidekick -srcfolder build/dmg -ov -format UDZO "$dmg" && break
              sleep 5
            done
          fi
          test -f "$dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: sidekick-macos
          path: app/build/dist/*.dmg
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Work out the version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"
          elif [[ "$RELEASE_TAG" == v* ]]; then v="${RELEASE_TAG#v}"
          else v="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      # Unsigned: sideloading tools (AltStore, Sideloadly) sign it with your
      # own Apple ID when installing. See README.
      - run: flutter build ios --release --no-codesign --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }}

      - name: Package the .ipa
        run: |
          mkdir -p build/ipa/Payload build/dist
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry "../dist/Sidekick-${{ steps.version.outputs.version }}.ipa" Payload

      # An AltStore/SideStore source, so the iPhone app installs and updates
      # with one tap. Its URL never changes:
      # https://github.com/<repo>/releases/latest/download/altstore.json
      - name: Write the AltStore source
        run: |
          python3 tool/altstore_source.py \
            --app build/ios/iphoneos/Runner.app \
            --ipa "build/dist/Sidekick-${{ steps.version.outputs.version }}.ipa" \
            --tag "v${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --out build/dist/altstore.json
          cp ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png build/dist/sidekick-icon.png

      - uses: actions/upload-artifact@v4
        with:
          name: sidekick-ios
          path: |
            app/build/dist/*.ipa
            app/build/dist/altstore.json
            app/build/dist/sidekick-icon.png
          if-no-files-found: error

  # Uploads each release to TestFlight. Needs a paid Apple Developer account;
  # skips itself until these repository secrets exist (see README):
  #   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
  # Optional repository variable IOS_BUNDLE_ID if dev.sidekick.sidekick is taken.
  testflight:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [test]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'dev.sidekick.sidekick' }}
    steps:
      - name: Check for App Store Connect keys
        id: keys
        run: |
          if [[ -n "$APPLE_TEAM_ID" && -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_KEY_P8" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight skipped: add APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 secrets to enable it."
          fi
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ready
      - uses: subosito/flutter-action@v2
        if: steps.keys.outputs.ready
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Work out the version
        if: steps.keys.outputs.ready
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"
          elif [[ "$RELEASE_TAG" == v* ]]; then v="${RELEASE_TAG#v}"
          else v="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Prepare the Xcode project
        if: steps.keys.outputs.ready
        run: |
          flutter pub get
          # Only the app target: a command-line override would also rename
          # the plugin frameworks, and Apple rejects duplicate bundle ids.
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = dev.sidekick.sidekick;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/" ios/Runner.xcodeproj/project.pbxproj
          flutter build ios --release --config-only --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }}

      # Xcode signs with automatically managed certificates and profiles,
      # using the App Store Connect API key, then uploads the build.
      - name: Archive, sign and upload to TestFlight
        if: steps.keys.outputs.ready
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$key"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          xcodebuild archive \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Sidekick.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${auth[@]}"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Sidekick.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}"
          rm -f "$key"

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [test, windows, android, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download

            **Windows 10/11:** download the **SidekickSetup** `.exe` below and run it. The installer adds Start menu and desktop shortcuts, and allows Sidekick through Windows Firewall on private networks.

            **Android 8.0+:** on your phone, download the **Sidekick** `.apk` below and open it. If asked, allow your browser or Files app to install apps.

            **macOS 12+:** open the **Sidekick** `.dmg` and drag Sidekick into Applications. The first time, right-click Sidekick → **Open** → **Open** (it isn't notarized yet). On macOS 15 and newer: try to open it once, then go to **System Settings → Privacy & Security** and click **Open Anyway**.

            **iPhone/iPad (iOS 15+):** install [AltStore](https://altstore.io) or [SideStore](https://sidestore.io) once, then add this source in it: `https://github.com/${{ github.repository }}/releases/latest/download/altstore.json` and tap **Sidekick → Install**. New versions then show up as updates. (Or install the `.ipa` below with [Sideloadly](https://sideloadly.io).)

            Windows may show "Windows protected your PC" because the installer isn't code-signed yet. Click **More info → Run anyway**.
