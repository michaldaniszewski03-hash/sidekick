name: Windows app

on:
  push:
    paths: ["app/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: sidekick-windows-x64
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
